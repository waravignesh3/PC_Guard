spring.application.name=pc-guard-backend
server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pc_guard}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
pcguard.security.agent-api-key=${AGENT_API_KEY:}
pcguard.cors.frontend-url=${FRONTEND_URL:http://localhost:5173}
pcguard.heartbeat.warning-seconds=${HEARTBEAT_WARNING_SECONDS:30}
pcguard.heartbeat.offline-seconds=${HEARTBEAT_OFFLINE_SECONDS:90}
pcguard.threshold.cpu-warning=${CPU_WARNING_THRESHOLD:85}
pcguard.threshold.cpu-critical=${CPU_CRITICAL_THRESHOLD:95}
pcguard.threshold.ram-warning=${RAM_WARNING_THRESHOLD:80}
pcguard.threshold.ram-critical=${RAM_CRITICAL_THRESHOLD:90}
pcguard.threshold.storage-warning=${STORAGE_WARNING_THRESHOLD:80}
pcguard.threshold.storage-critical=${STORAGE_CRITICAL_THRESHOLD:90}
