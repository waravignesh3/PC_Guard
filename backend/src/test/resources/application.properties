spring.datasource.url=jdbc:h2:mem:pcguard;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
pcguard.security.agent-api-key=
pcguard.cors.frontend-url=http://localhost:5173
pcguard.threshold.cpu-warning=85
pcguard.threshold.cpu-critical=95
pcguard.threshold.ram-warning=80
pcguard.threshold.ram-critical=90
pcguard.threshold.storage-warning=80
pcguard.threshold.storage-critical=90
