agent.version=1.0.0
agent.data-directory=data
server.base-url=http://localhost:8080
server.register-path=/api/v1/agents/register
server.heartbeat-path=/api/v1/agents/{agentId}/heartbeat
server.telemetry-path=/api/v1/agents/{agentId}/telemetry
server.connect-timeout-ms=3000
monitor.sample.interval-ms=5000
monitor.telemetry.interval-ms=60000
monitor.heartbeat.interval-ms=30000
monitor.confirmation.samples=3
monitor.process.enabled=false
threshold.cpu.warning=85
threshold.cpu.critical=95
threshold.memory.warning=80
threshold.memory.critical=90
threshold.memory.available-mb=512
threshold.disk.warning=80
threshold.disk.critical=90
threshold.disk.critical-free-mb=1024
threshold.temperature.warning=80
threshold.temperature.critical=90
threshold.battery.warning=20
threshold.battery.critical=10
threshold.process.cpu=75
threshold.process.memory-mb=1024
threshold.uptime.days=30
network.test.enabled=true
network.test.host=8.8.8.8
network.test.port=53
network.test.timeout-ms=1500
offline.queue.enabled=true
